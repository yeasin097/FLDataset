# Shared config for every nginx-stack company site.
# Content is mounted read-only at /usr/share/nginx/html.
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Always answer /login (any method) so login brute force produces a
    # steady stream of POSTs that never succeed. "Invalid" is the fail string.
    location = /login {
        default_type text/plain;
        return 200 "Invalid credentials. Please try again.";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
